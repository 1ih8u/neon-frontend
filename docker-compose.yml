services:
  backend:
    build: ./backend
    container_name: neon_backend
    command: >
      sh -c "
        chown -R www-data:www-data /app/staticfiles &&
        chown -R www-data:www-data /app/media &&
        python manage.py collectstatic --noinput &&
        gunicorn core.wsgi:application --bind 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
      - /app/venv
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}

      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}

      - MAIN_DOMAIN=${MAIN_DOMAIN}
      - API_DOMAIN=${API_DOMAIN}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN}
    depends_on:
      - db
    networks:
      - app-network

  nginx-backend:
    image: nginx:alpine
    container_name: neon_nginx_backend
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:16
    container_name: neon_postgres_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: neon_adminer
    depends_on:
      - db
    # ports:
    #   - "8080:8080"
    networks:
      - app-network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge
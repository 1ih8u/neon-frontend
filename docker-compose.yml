  #     - backend
  #     - frontend
  #   networks:
  #     - app-network

  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   command: certonly --webroot -w /var/www/certbot --force-renewal --email your-email@example.com -d bogorodovneon.ru -d api.bogorodovneon.ru -d admin.bogorodovneon.ru --agree-tos

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge

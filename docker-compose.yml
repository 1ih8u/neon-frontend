services:
  backend:
    build: ./backend
    container_name: neon_backend
    command: sh -c "./wait-for-postgres.sh db && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - /app/venv
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}

      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}

      - MAIN_DOMAIN=${MAIN_DOMAIN}
      - API_DOMAIN=${API_DOMAIN}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN}
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile.frontend
    container_name: neon_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=${VITE_API_URL}
    networks:
      - app-network

  db:
    image: postgres:16
    container_name: neon_postgres_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: neon_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - app-network

  # nginx:
  #   image: nginx:latest
  #   container_name: neon_nginx
  #   ports:
  #     - "8043:80"
  #   volumes:
  #     - ./nginx:/etc/nginx/conf.d
  #     - static_volume:/static
  #     - media_volume:/media
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot

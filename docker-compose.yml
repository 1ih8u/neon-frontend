services:
  backend:
    build: ./backend
    container_name: neon_backend
    command: sh -c "./wait-for-postgres.sh db python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - /app/venv
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      - db
  db:
    image: postgres:16
    container_name: neon_postgres_db
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  adminer:
    image: adminer
    container_name: neon_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: 